<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>To-Do List</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar bg-primary">
        <div class="container">
            <a class="navbar-brand text-white" href="index.html">
                My To-Do List
            </a>
        </div>
    </nav>

    <main>
        <article>
            <section id="home" class="bg-light text-center py-5">

                <div class="container">

                    <h1 class="display-4">
                        <b>Task Manager</b>
                    </h1>

                    <p class="lead">
                        Organize your tasks and stay productive.
                    </p>

                    <form id="taskForm" class="task-form mx-auto mt-4">
                        <div class="input-group">
                            <input
                                type="text"
                                class="form-control"
                                id="taskInput"
                                placeholder="Enter a new task"
                                aria-label="Enter a new task">

                            <button type="submit" class="btn btn-primary">
                                Add Task
                            </button>
                        </div>
                    </form>

                    <p
                        id="errorMessage"
                        class="text-danger mt-2"
                        role="alert">
                    </p>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <p class="remaining-tasks mb-0">
                            Tasks remaining
                        </p>

                        <span id="taskCounter" class="badge bg-primary fs-6">
                            0 remaining 
                        </span>
                    </div>
                    
                    <div
                        class="btn-group mt-3"
                        role="group"
                        aria-label="Filter tasks">

                        <input
                            type="radio"
                            class="btn-check"
                            name="taskFilter"
                            id="filterAll"
                            value="all"
                            autocomplete="off"
                            checked>

                        <label class="btn btn-outline-primary" for="filterAll">
                            All
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="taskFilter"
                            id="filterActive"
                            value="active"
                            autocomplete="off">

                        <label class="btn btn-outline-primary" for="filterActive">
                            Active
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="taskFilter"
                            id="filterCompleted"
                            value="completed"
                            autocomplete="off">

                        <label class="btn btn-outline-primary" for="filterCompleted">
                            Completed
                        </label>

                    </div>

                    <ul
                        id="taskList"
                        class="list-group task-list mx-auto mt-4 text-start">
                    </ul>

                    <button
                        type="button"
                        id="clearCompleted"
                        class="btn btn-outline-danger mt-4">
                        Clear Completed
                    </button>

                </div>
            </section>
        </article>
    </main>

    <script src="script.js"></script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>
</html>
